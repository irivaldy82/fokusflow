<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071c16"><title>FokusFlow Premium Lokal</title>
  <style>
    :root{--bg:#071c16;--panel:#102b23;--panel2:#13362b;--ink:#edf9f2;--muted:#9bb8aa;--mint:#75e9b0;--line:rgba(200,255,225,.12);--warn:#ffc36b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#194d3b 0,transparent 32rem),var(--bg);color:var(--ink);font-family:Inter,Segoe UI,system-ui,sans-serif;min-height:100vh}.app{max-width:1400px;margin:auto;padding:22px;display:grid;grid-template-columns:240px 1fr;gap:22px}.side{border:1px solid var(--line);background:rgba(11,38,29,.78);border-radius:26px;padding:20px;min-height:calc(100vh - 44px)}.brand{display:flex;gap:10px;align-items:center;font-size:1.2rem;font-weight:800}.mark{background:var(--mint);color:#063020;border-radius:12px;width:34px;height:34px;display:grid;place-items:center;font-size:1.4rem}.premium{font-size:.68rem;background:rgba(117,233,176,.15);color:var(--mint);padding:4px 8px;border-radius:99px;margin:20px 0 12px;display:inline-block}.nav{display:grid;gap:7px}.nav button{background:transparent;color:var(--muted);border:0;text-align:left;padding:11px;border-radius:10px;font:inherit}.nav button.active,.nav button:hover{background:rgba(117,233,176,.11);color:var(--ink)}.local{position:sticky;top:20px;margin-top:38px;border-top:1px solid var(--line);padding-top:16px;font-size:.78rem;color:var(--muted)}.main{min-width:0}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin:6px 0 22px}.eyebrow{color:var(--mint);font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.top h1{font-size:clamp(1.6rem,3vw,2.4rem);letter-spacing:-.05em;margin:5px 0}.date{color:var(--muted);font-size:.9rem}.grid{display:grid;grid-template-columns:1.55fr .9fr;gap:18px}.card{background:linear-gradient(145deg,rgba(23,57,44,.96),rgba(12,36,28,.95));border:1px solid var(--line);border-radius:24px;padding:22px}.card h2{font-size:1rem;margin:0}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head small{color:var(--muted)}.form{display:grid;grid-template-columns:1fr 115px 110px 90px;gap:9px;margin:20px 0 8px}.input,select,textarea{color:var(--ink);background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;outline:none}.input:focus,select:focus,textarea:focus{border-color:var(--mint)}select option{background:#16372c}.button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;background:var(--mint);color:#063020;cursor:pointer}.button.ghost{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line)}.task-list{display:grid;gap:9px;margin-top:16px}.task{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:13px;border-radius:15px}.task.done{opacity:.55}.task input{accent-color:var(--mint);width:18px;height:18px}.task-title{flex:1;font-weight:650}.task.done .task-title{text-decoration:line-through}.meta{font-size:.75rem;color:var(--muted)}.tag{font-size:.7rem;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:#c6e9d5}.tag.high{color:#ffc36b;background:rgba(255,195,107,.13)}.empty{padding:28px 5px;color:var(--muted);text-align:center}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{background:rgba(0,0,0,.13);border:1px solid var(--line);border-radius:17px;padding:15px}.stat b{font-size:1.55rem;display:block}.stat span{font-size:.78rem;color:var(--muted)}.ring{width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--mint) var(--p,0%),rgba(255,255,255,.09) 0);display:grid;place-items:center;margin:16px auto}.ring:after{content:'';width:100px;height:100px;position:absolute;border-radius:50%;background:#123126}.ring b{z-index:1;font-size:1.4rem}.timer{text-align:center;padding:14px 0 5px}.time{font-variant-numeric:tabular-nums;font-size:3.65rem;font-weight:800;letter-spacing:-.07em}.timer small{color:var(--muted)}.timer-actions{display:flex;justify-content:center;gap:9px;margin-top:18px}.note{margin-top:18px}.note textarea{width:100%;height:135px;resize:vertical;margin-top:12px;line-height:1.5}.bottom{margin-top:18px}.db{font-size:.75rem;color:var(--muted);word-break:break-all}.toast{position:fixed;right:22px;bottom:22px;background:#c6ffe0;color:#073521;padding:12px 15px;border-radius:12px;font-weight:700;transform:translateY(100px);transition:.25s;box-shadow:0 12px 35px #0008}.toast.show{transform:translateY(0)}@media(max-width:900px){.app{grid-template-columns:1fr;padding:13px}.side{min-height:0;padding:15px}.local{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.form .button{grid-column:span 2}}@media(max-width:460px){.form{grid-template-columns:1fr}.form .button{grid-column:auto}.time{font-size:3rem}}
  </style>
</head>
<body><div class="app">
  <aside class="side"><div class="brand"><span class="mark">+</span>FokusFlow</div><span class="premium">PREMIUM · LOKAL</span><nav class="nav"><button class="active">▣ Hari ini</button><button>◷ Sesi fokus</button><button>✓ Kebiasaan</button><button>⌁ Insight mingguan</button></nav><div class="local">● Data privat di laptop<br><span id="dbHint">Menyiapkan database SQL…</span></div></aside>
  <main class="main"><header class="top"><div><div class="eyebrow">Ruang fokus Anda</div><h1>Mulai kecil, lalu bergerak.</h1><div class="date" id="today"></div></div><button class="button ghost" id="showDb">Lokasi database</button></header>
  <section class="grid"><div class="card"><div class="head"><h2>Rencana hari ini</h2><small id="taskCaption">Memuat…</small></div><form class="form" id="taskForm"><input class="input" id="taskTitle" required maxlength="120" placeholder="Apa satu langkah kecil berikutnya?"><input class="input" id="project" value="Pribadi" maxlength="40" placeholder="Proyek"><select id="priority"><option value="normal">Normal</option><option value="high">Penting</option><option value="low">Santai</option></select><button class="button">Tambah</button></form><div class="task-list" id="tasks"></div></div>
  <div class="card"><div class="head"><h2>Progres harian</h2><small>tersimpan lokal</small></div><div class="ring" id="ring"><b id="percent">0%</b></div><div class="stats"><div class="stat"><b id="doneStat">0/0</b><span>Tugas selesai</span></div><div class="stat"><b id="focusStat">0m</b><span>Fokus tercatat</span></div></div><div class="timer"><div class="time" id="clock">25:00</div><small id="timerLabel">Satu sesi, satu arah.</small><div class="timer-actions"><button class="button" id="start">Mulai fokus</button><button class="button ghost" id="reset">Atur ulang</button></div></div></div></section>
  <section class="card bottom"><div class="head"><h2>Parkir pikiran</h2><small id="noteState">Privat di laptop Anda</small></div><div class="note"><textarea id="note" placeholder="Tulis hal yang mengganggu pikiran. Anda tidak perlu menanganinya sekarang."></textarea></div></section>
  </main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), today=new Date().toLocaleDateString('en-CA'), invoke=window.__TAURI__?.core?.invoke;
let secs=1500, running=false, timer, currentTask=null;
const tell=t=>{$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2600)};
const call=(cmd,args={})=>invoke?invoke(cmd,args):Promise.reject(new Error('Buka melalui aplikasi FokusFlow Desktop.'));
$('#today').textContent=new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
function drawClock(){const m=Math.floor(secs/60),s=secs%60;$('#clock').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
async function refresh(){try{const [tasks,summary]=await Promise.all([call('list_tasks',{date:today}),call('daily_summary',{date:today})]);const box=$('#tasks');box.innerHTML='';if(!tasks.length)box.innerHTML='<div class="empty">Belum ada tugas. Pilih satu langkah kecil yang realistis.</div>';tasks.forEach(t=>{const row=document.createElement('div');row.className='task '+(t.status==='done'?'done':'');row.innerHTML=`<input type="checkbox" ${t.status==='done'?'checked':''}><div class="task-title">${escapeHtml(t.title)}<div class="meta">${escapeHtml(t.project)} · ±${t.estimate_minutes} menit</div></div><span class="tag ${t.priority==='high'?'high':''}">${t.priority==='high'?'Penting':t.priority==='low'?'Santai':'Normal'}</span>`;row.querySelector('input').onchange=async e=>{await call('toggle_task',{id:t.id,done:e.target.checked});refresh()};row.onclick=e=>{if(e.target.tagName!=='INPUT'){currentTask=t.id;tell('Sesi fokus akan dicatat ke: '+t.title)}};box.append(row)});const p=summary.total?Math.round(summary.done/summary.total*100):0;$('#ring').style.setProperty('--p',p+'%');$('#percent').textContent=p+'%';$('#doneStat').textContent=summary.done+'/'+summary.total;$('#focusStat').textContent=summary.focus_minutes+'m';$('#taskCaption').textContent=summary.total?`${summary.done} dari ${summary.total} selesai`:'Buat satu prioritas';}catch(e){tell(e.message)}}
function escapeHtml(v){const d=document.createElement('div');d.textContent=v;return d.innerHTML}
$('#taskForm').onsubmit=async e=>{e.preventDefault();const title=$('#taskTitle').value.trim();if(!title)return;await call('add_task',{title,project:$('#project').value.trim()||'Pribadi',priority:$('#priority').value,estimateMinutes:25,plannedDate:today});$('#taskTitle').value='';refresh();tell('Tugas kecil ditambahkan.')};
$('#start').onclick=()=>{if(running){clearInterval(timer);running=false;$('#start').textContent='Lanjutkan';$('#timerLabel').textContent='Sesi dijeda.';return}running=true;$('#start').textContent='Jeda';$('#timerLabel').textContent='Fokus pada satu langkah saja.';timer=setInterval(async()=>{secs--;drawClock();if(secs<=0){clearInterval(timer);running=false;secs=1500;drawClock();$('#start').textContent='Mulai fokus';await call('save_focus_session',{taskId:currentTask,minutes:25});refresh();tell('Sesi 25 menit tersimpan. Istirahat sebentar.')}},1000)};
$('#reset').onclick=()=>{clearInterval(timer);running=false;secs=1500;drawClock();$('#start').textContent='Mulai fokus';$('#timerLabel').textContent='Satu sesi, satu arah.'};
let noteTimer;$('#note').oninput=e=>{clearTimeout(noteTimer);$('#noteState').textContent='Menyimpan…';noteTimer=setTimeout(async()=>{await call('save_note',{content:e.target.value});$('#noteState').textContent='Tersimpan privat di laptop'},500)};
$('#showDb').onclick=async()=>{try{const p=await call('database_location');$('#dbHint').textContent=p;tell('Lokasi database ditampilkan di sisi kiri.')}catch(e){tell(e.message)}};
(async()=>{drawClock();try{$('#note').value=await call('load_note');$('#dbHint').textContent='SQLite aktif · data tidak diunggah';refresh()}catch(e){$('#dbHint').textContent='Jalankan dari installer Windows';tell(e.message)}})();
</script></body></html>
